name: Release Please

# Maintains a release PR from Conventional Commits (feat/fix/...), updates
# CHANGELOG.md and the version in apm.yml, and tags a release on merge.
#
# Artifact freshness: release-please updates the authoritative version state
# (apm.yml $.version + .release-please-manifest.json) but does NOT regenerate the
# version-derived artifacts -- the `version` in .claude-plugin/plugin.json and the
# per-plugin versions in the .claude-plugin / .agents marketplace.json files. Those
# go stale the moment a version bumps, so the "Sync generated artifacts" step below
# regenerates them and amends them onto the release branch whenever a release PR is
# open.
#
# TOKEN: the release PR is authored with a GitHub App token (RELEASE_APP_CLIENT_ID +
# RELEASE_APP_PRIVATE_KEY), NOT the default GITHUB_TOKEN. GITHUB_TOKEN cannot open a
# PR unless the repo enables "Allow GitHub Actions to create and approve pull
# requests"; an App-token-authored PR bypasses that setting entirely, and its commits
# trigger any future required checks (GITHUB_TOKEN commits do not). The same token
# pushes the artifact-sync amend so it, too, is App-authored.
# App permissions required (this repo): Contents RW + Pull requests RW.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint release-app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Checkout with the App token persisted as the push credential, so the
      # artifact-sync amend below is App-authored too.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # (History cutoff for non-Conventional web-edit commits lives in the config
          # file as per-package bootstrap-sha, not here -- it is not an action input.)

      - name: Set up Python
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"

      # When a release PR is open, its apm.yml/manifest version bumps make the
      # generated plugin.json + marketplace.json versions stale. Regenerate them and
      # amend onto the release branch. No-op (no diff -> no commit) when already in
      # sync. The App token persisted by checkout above pushes the amend.
      - name: Sync generated artifacts on the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_BRANCH"
          git checkout "$RELEASE_BRANCH"

          python3 -m pip install --quiet -r .github/requirements-ci.txt
          python3 .apm/scripts/build-native-plugins.py
          python3 .apm/scripts/render-docs.py all
          apm run build-marketplace

          if git diff --quiet; then
            echo "Generated artifacts already in sync; nothing to amend."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync generated artifacts to released versions"
          git push origin "HEAD:$RELEASE_BRANCH"
